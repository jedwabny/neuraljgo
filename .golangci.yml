version: "2"

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true

linters:
  enable:
    - bodyclose
    - contextcheck
    - dupl
    - forbidigo
    - gocritic
    - godox
    - govet
    - ineffassign
    - nilerr
    - nilnil
    - prealloc
    - revive
    - staticcheck
    - unused

  settings:
    dupl:
      threshold: 200

    nilnil:
      detect-opposite: true

  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
      - common-false-positives
      - legacy

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
